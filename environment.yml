name: flashvla
channels:
  - conda-forge
dependencies:
  - python=3.12
  - cmake
  - make
  - c-compiler
  - cxx-compiler
  - ffmpeg=7.*
  - libnpp=12.*
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.9.1+cu128
      - torchvision==0.24.1+cu128
      - torchcodec==0.9.1+cu128
      - h5py
      - -e .
