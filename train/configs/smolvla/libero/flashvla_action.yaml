# SmolVLA FlashVLA on LIBERO
#
# End-to-end training config: SmolVLA-500M base + buffer streaming
# (N=5 slots × C=10 actions). VLM is kept frozen (train_expert_only=True),
# only the action expert + projections train. Per-sample (PerSeg) time
# sampling.
#
# Notes:
# - LIBERO state_dim=8, action_dim=7 → padded to max_state_dim/max_action_dim=32.
# - 2 cameras (image, image2) at 256×256 → resized + padded to 512×512 for
#   SmolVLM2's vision tower.
# - `train_expert_only=True` makes ~100M params trainable out of ~450M.

policy:
  type: smolvla-flashvla
  pretrained_path: lerobot/smolvla_base
  push_to_hub: false
  device: cuda

  # Streaming buffer
  num_buffer_slots: 5
  chunk_size: 10
  n_action_steps: 10
  use_action_prefix: false
  timestep_sample_mode: per-sample
  cold_start_mode: zero_delta

  # SmolVLA-specific (inherited from baseline SmolVLAConfig)
  freeze_vision_encoder: false
  train_expert_only: false
  load_vlm_weights: true
  attention_mode: cross_attn

  normalization_mapping:
    VISUAL: IDENTITY
    STATE: MEAN_STD
    ACTION: MEAN_STD


# Dataset
dataset:
  repo_id: HuggingfaceVLA/libero
  video_backend: torchcodec

# Output / runtime
output_dir: flashvla_libero_smolvla/flashvla_action_libero_smolvla_chunk10buffer5
job_name: flashvla_action_libero_smolvla_chunk10buffer5
batch_size: 64
grad_accum_steps: 1
steps: 20000
num_workers: 2
seed: 1000

# Optimizer
use_policy_training_preset: false
optimizer:
  type: adamw
  lr: 1e-4
  betas: [0.9, 0.95]
  weight_decay: 1.0e-10
  grad_clip_norm: 10

# Scheduler
scheduler:
  type: cosine_decay_with_warmup
  num_warmup_steps: 1000
  peak_lr: 1e-4
  decay_lr: 2.5e-6
  num_decay_steps: 20000

# Checkpointing
save_checkpoint: false
save_freq: 2000

# Logging
log_freq: 10
wandb:
  enable: true
  project: flashvla-smolvla
  entity: null
  disable_artifact: true
