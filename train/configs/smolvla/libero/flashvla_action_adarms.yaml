# SmolVLA FlashVLA on LIBERO — adaRMS variant
#
# Same as flashvla_action.yaml but with use_adarms_time_cond=true:
# - Keep baseline smolvla_base's action_in_proj / action_time_mlp_in/out /
#   state_proj (token embedding path unchanged; baseline weights loaded as-is).
# - Add parallel FiLM cond paths: new time_mlp_in/out (random init).
# - Swap expert's LlamaRMSNorm → LlamaAdaRMSNorm with FiLM dense layers
#   (zero weight + zero bias → step 0 is mathematically identical to the
#   baseline smolvla concat-time forward).
# - Option (A): state stays in PREFIX (smolvla's native layout); no
#   state_mlp_in/out added. cond is time-only.
#
# Use this yaml + flashvla_action.yaml for an A/B comparison: same hyper-
# parameters, same data, same step budget — only `use_adarms_time_cond` differs.

policy:
  type: smolvla-flashvla
  pretrained_path: lerobot/smolvla_base
  push_to_hub: false
  device: cuda

  # Streaming buffer
  num_buffer_slots: 4
  chunk_size: 10
  n_action_steps: 10
  use_action_prefix: false
  timestep_sample_mode: per-sample
  cold_start_mode: zero_delta

  # FiLM ON (additive on top of baseline)
  use_adarms_time_cond: true

  # SmolVLA-specific (inherited from baseline SmolVLAConfig)
  freeze_vision_encoder: false
  train_expert_only: false
  load_vlm_weights: true
  attention_mode: cross_attn

  normalization_mapping:
    VISUAL: IDENTITY
    STATE: MEAN_STD
    ACTION: MEAN_STD


# Dataset
dataset:
  repo_id: HuggingfaceVLA/libero
  video_backend: torchcodec

# Output / runtime
output_dir: flashvla_action_libero_smolvla_chunk10buffer4_adarms
job_name: flashvla_action_libero_smolvla_chunk10buffer4_adarms
batch_size: 64
grad_accum_steps: 1
steps: 50000
num_workers: 2
seed: 1000

# Optimizer
use_policy_training_preset: false
optimizer:
  type: adamw
  lr: 1e-4
  betas: [0.9, 0.95]
  weight_decay: 1.0e-10
  grad_clip_norm: 10

# Scheduler
scheduler:
  type: cosine_decay_with_warmup
  num_warmup_steps: 1000
  peak_lr: 1e-4
  decay_lr: 2.5e-6
  num_decay_steps: 50000

# Checkpointing
save_checkpoint: false
save_freq: 5000

# Logging
log_freq: 50
wandb:
  enable: true
  project: flashvla-smolvla
  entity: null
  disable_artifact: true
