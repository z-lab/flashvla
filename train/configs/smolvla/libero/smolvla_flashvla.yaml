# Policy configuration
policy:
  type: smolvla-flashvla
  pretrained_path: lerobot/smolvla_base
  push_to_hub: false
  device: cuda
  num_buffer_slots: 5
  chunk_size: 10
  # FiLM ON (additive on top of baseline)
  use_adarms_time_cond: true

  # SmolVLA-specific (inherited from baseline SmolVLAConfig)
  freeze_vision_encoder: false
  train_expert_only: false
  load_vlm_weights: true
  attention_mode: cross_attn

  normalization_mapping:
    VISUAL: IDENTITY
    STATE: MEAN_STD
    ACTION: MEAN_STD


# Dataset configuration
dataset:
  repo_id: HuggingfaceVLA/libero
  video_backend: torchcodec

# Training parameters
output_dir: smolvla_flashvla_libero
job_name: smolvla_flashvla_libero
batch_size: 64
grad_accum_steps: 1
steps: 20000
num_workers: 4
seed: 1000

# FSDP is not supported for SmolVLA: its mixed VLM/expert attention calls
# decoder-layer submodules directly (bypassing module __call__), so FSDP2's
# unshard hooks never fire. At ~450M params the model doesn't need sharding —
# the default multi-GPU launch runs plain DDP, the path the released results used.
fsdp:
  enable: false

# Optimizer configuration
use_policy_training_preset: false
optimizer:
  type: adamw
  lr: 1e-4
  betas: [0.9, 0.95]
  weight_decay: 1.0e-10

# Learning rate scheduler
scheduler:
  type: cosine_decay_with_warmup
  num_warmup_steps: 1000
  peak_lr: 1e-4
  decay_lr: 2.5e-6
  num_decay_steps: 20000

# Checkpointing
save_checkpoint: true
save_freq: 50000

# Logging
log_freq: 50
wandb:
  enable: true
  project: flashvla-libero
  entity: null
  disable_artifact: true
