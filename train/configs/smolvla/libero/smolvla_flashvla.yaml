policy:
  type: smolvla-flashvla
  pretrained_path: lerobot/smolvla_base
  push_to_hub: false
  device: cuda
  num_buffer_slots: 5
  chunk_size: 10
  use_adarms_time_cond: true

  freeze_vision_encoder: false
  train_expert_only: false
  load_vlm_weights: true
  attention_mode: cross_attn

  normalization_mapping:
    VISUAL: IDENTITY
    STATE: MEAN_STD
    ACTION: MEAN_STD


dataset:
  repo_id: HuggingfaceVLA/libero
  video_backend: torchcodec

output_dir: smolvla_flashvla_libero
job_name: smolvla_flashvla_libero
batch_size: 64
grad_accum_steps: 1
steps: 20000
num_workers: 4
seed: 1000

fsdp:
  enable: false

use_policy_training_preset: false
optimizer:
  type: adamw
  lr: 1e-4
  betas: [0.9, 0.95]
  weight_decay: 1.0e-10

scheduler:
  type: cosine_decay_with_warmup
  num_warmup_steps: 1000
  peak_lr: 1e-4
  decay_lr: 2.5e-6
  num_decay_steps: 20000

save_checkpoint: true
save_freq: 50000

log_freq: 50
wandb:
  enable: true
  project: flashvla-libero
  entity: null
  disable_artifact: true
