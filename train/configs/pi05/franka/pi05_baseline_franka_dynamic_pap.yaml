# PI05 Baseline Training on Franka real-robot pick-and-place
#
# Single-task, single-embodiment real-robot dataset (gello teleop).
#  - 58 episodes (excluded 4-11, 20 due to gello calibration issues)
#  - 70129 frames @ 30 fps
#  - 8-dim state/action (7 Franka joints + 1 gripper, normalized [0,1])
#  - 2 cameras: cam_wrist (ego), cam_high (third-person opposite)
#
# Real-robot data uses MEAN_STD normalization (smoother distribution than sim,
# no q01/q99 needed). chunk_size=50 matches pi05_base pretraining.
#
# Data: /path/to/franka_pick_and_place_lerobot_v3/

policy:
  type: pi05
  pretrained_path: lerobot/pi05_base
  push_to_hub: false
  dtype: bfloat16
  device: cuda
  state_cond: false
  chunk_size: 50
  n_action_steps: 50
  freeze_vision_encoder: false
  normalization_mapping:
    VISUAL: IDENTITY
    STATE: MEAN_STD
    ACTION: MEAN_STD

dataset:
  repo_id: dynamic_pap
  root: /path/to/dynamic_pap_lerobot_v3  # local LeRobot-v3 dataset dir (edit me)
  # torchcodec decode crashes with std::bad_alloc in this env; pyav works.
  video_backend: pyav

output_dir: pi05_franka/pi05_franka_dynamic_pap
job_name: pi05_franka_dynamic_pap
batch_size: 4
grad_accum_steps: 2
steps: 50000
num_workers: 4
seed: 1000

use_policy_training_preset: false
optimizer:
  type: adamw
  lr: 5.0e-5
  betas: [0.9, 0.95]
  weight_decay: 1.0e-10
  grad_clip_norm: 1.0

scheduler:
  type: cosine_decay_with_warmup
  num_warmup_steps: 1000
  peak_lr: 5.0e-5
  decay_lr: 2.5e-6
  num_decay_steps: 30000

save_checkpoint: true
save_freq: 5000

log_freq: 50
wandb:
  enable: true
  project: flashvla-franka
  entity: null
  disable_artifact: true

max_delay_steps: 0
