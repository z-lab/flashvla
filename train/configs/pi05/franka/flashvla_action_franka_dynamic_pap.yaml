# FlashVLA FlashVLA Training on Franka real-robot dynamic pick-and-place
#
# Single-task, single-embodiment real-robot dataset (gello teleop).
#  - 50 episodes, 20143 frames @ 30 fps
#  - 8-dim state/action (7 joints + gripper), 2 cameras (cam0 wrist + cam1 scene)
#  - Dynamic task: "Pick up the moving tennis ball and place it into the baset"
#
# Action streaming: N=5 buffer slots × C=10 chunk = 50-step prediction horizon
# (matches pi05_base pretraining), with shared observation conditioning.
# Recipe follows flashvla_action_franka_pick_and_place_new.yaml: MEAN_STD
# normalization, per-sample timestep sampling, lr=5e-5 cosine 30k.
#
# Data: a LeRobot-v3 real-robot dataset (set dataset.root below)

policy:
  type: pi05-flashvla
  pretrained_path: lerobot/pi05_base
  push_to_hub: false
  dtype: bfloat16
  device: cuda
  state_cond: false
  num_buffer_slots: 4
  chunk_size: 20
  # Real-robot Franka data: PerSeg required (legacy per-chunk run @ constant
  # lr=1e-5 still cascaded around step 33k).
  timestep_sample_mode: "per-sample"
  freeze_vision_encoder: false
  freeze_vlm: false
  cold_start_mode: current_state
  normalization_mapping:
    VISUAL: IDENTITY
    STATE: MEAN_STD
    ACTION: MEAN_STD

dataset:
  repo_id: dynamic_pap
  root: /path/to/dynamic_pap_lerobot_v3  # local LeRobot-v3 dataset dir (edit me)
  # torchcodec decode crashes with std::bad_alloc in this env; pyav works.
  video_backend: pyav

output_dir: flashvla_action_franka/flashvla_action_franka_dynamic_pap
job_name: flashvla_action_franka_dynamic_pap
batch_size: 4
grad_accum_steps: 2
steps: 50000
num_workers: 4
seed: 1000

use_policy_training_preset: false
optimizer:
  type: adamw
  lr: 5e-5
  betas: [0.9, 0.95]
  weight_decay: 1.0e-10
  grad_clip_norm: 1.0

scheduler:
  type: cosine_decay_with_warmup
  num_warmup_steps: 2000
  peak_lr: 5e-5
  decay_lr: 5e-6
  num_decay_steps: 50000

save_checkpoint: true
save_freq: 5000

log_freq: 50
wandb:
  enable: true
  project: flashvla-franka
  entity: null
  disable_artifact: true
