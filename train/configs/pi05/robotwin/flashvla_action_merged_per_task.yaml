# FlashVLA FlashVLA Per-Task Training — MERGED setting
#
# Trains pi05-flashvla on merged_550 (50 clean + 500 randomized
# episodes per task, re-indexed 0..549, processed through the official
# openpi pipeline).
#
# Data: /path/to/RoboTwin-LeRobot-v3.0-merged/<task>/merged_550/

policy:
  type: pi05-flashvla
  pretrained_path: lerobot/pi05_base
  push_to_hub: false
  dtype: bfloat16
  device: cuda
  state_cond: false
  num_buffer_slots: 5
  chunk_size: 10
  # merged_550 includes the 500 randomized episodes that drive the
  # noise-floor cascade; use PerSeg.
  timestep_sample_mode: "per-sample"
  freeze_vision_encoder: false
  freeze_vlm: false
  cold_start_mode: current_state
  normalization_mapping:
    VISUAL: IDENTITY
    STATE: QUANTILES
    ACTION: QUANTILES

dataset:
  repo_id: robotwin_official_merged/per_task_placeholder
  video_backend: torchcodec

output_dir: flashvla_action_merged_per_task/per_task_placeholder
job_name: flashvla_action_merged
batch_size: 16
grad_accum_steps: 1
steps: 50000
num_workers: 4
seed: 1000

use_policy_training_preset: false
optimizer:
  type: adamw
  lr: 5.0e-5
  betas: [0.9, 0.95]
  weight_decay: 1.0e-10
  grad_clip_norm: 1.0

scheduler:
  type: cosine_decay_with_warmup
  num_warmup_steps: 500
  peak_lr: 5.0e-5
  decay_lr: 2.5e-6
  num_decay_steps: 10000

save_checkpoint: true
save_freq: 2000

log_freq: 50
wandb:
  enable: true
  project: flashvla-robotwin-merged
  entity: null
  disable_artifact: true
