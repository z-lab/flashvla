# FlashVLA Per-Task Training Configuration on RoboTwin
#
# Fine-tunes the flashvla pi05 variant on a SINGLE RoboTwin task at a
# time. Used as a template by scripts/train_flashvla_robotwin_per_task.sh,
# which loops over tasks and overrides dataset.root / dataset.repo_id /
# output_dir / job_name per task via draccus CLI args.
#
# Hyperparameters are aligned with the RoboTwin official openpi config
# `pi05_aloha_full_base`
# (RoboTwin/policy/pi05/src/openpi/training/config.py:556-582),
# scaled for our 8 GPU setup:
#
#   Official:    batch_size=64,  num_train_steps=20000, peak_lr=2.5e-5, warmup=1000
#   This config: eff_bs=16*8=128, steps=10000,          peak_lr=3.5e-5, warmup=500
#
# Same total samples seen (~1.28M per task). Batch doubled, lr scaled by
# sqrt(2), steps and warmup halved. AdamW betas, weight decay, grad clip and
# cosine decay endpoint are kept identical to official.

# Policy configuration
policy:
  type: pi05-flashvla
  pretrained_path: lerobot/pi05_base
  push_to_hub: false
  dtype: bfloat16
  device: cuda
  state_cond: false
  num_buffer_slots: 5
  chunk_size: 10
  # Generic RoboTwin per-task template; legacy per-chunk sampling matches
  # the historical pi05_aloha_full_base recipe this yaml mirrors. Switch
  # to "per-sample" when training on randomized data.
  timestep_sample_mode: "per-chunk"
  freeze_vision_encoder: true
  freeze_vlm: false
  cold_start_mode: current_state
  normalization_mapping:
    VISUAL: IDENTITY
    STATE: QUANTILES
    ACTION: QUANTILES

# Dataset — overridden per task by the orchestrator script:
#   --dataset.root=<root>/<task_name>/<config_subdir>
#   --dataset.repo_id=robotwin/<task_name>_<config_subdir>
dataset:
  repo_id: robotwin/per_task_placeholder
  video_backend: torchcodec

# robotwin_multitask.enable stays False (default) so train_flashvla.py takes
# the single-dataset path and reads cfg.dataset.root.

# Training parameters
output_dir: flashvla_action_robotwin_per_task/per_task_placeholder
job_name: flashvla_action_per_task
batch_size: 16
grad_accum_steps: 1
steps: 50000
num_workers: 4
seed: 1000

# Optimizer — official AdamW(b1=0.9, b2=0.95, wd=1e-10, clip=1.0)
use_policy_training_preset: false
optimizer:
  type: adamw
  lr: 5.0e-5
  betas: [0.9, 0.95]
  weight_decay: 1.0e-10
  grad_clip_norm: 1.0

# LR scheduler — official cosine decay with warmup; decay_lr kept at 2.5e-6.
# num_decay_steps is matched to `steps` so cosine reaches decay_lr at the end.
scheduler:
  type: cosine_decay_with_warmup
  num_warmup_steps: 500
  peak_lr: 5.0e-5
  decay_lr: 2.5e-6
  num_decay_steps: 10000

# Checkpointing — ~5 saves per task (10k / 2k)
save_checkpoint: true
save_freq: 2000

# Logging
log_freq: 50
wandb:
  enable: true
  project: flashvla-robotwin
  entity: null
  disable_artifact: true
