# PI05 Baseline Per-Task Training on RoboTwin (Official Data)
#
# Standard pi05 full-chunk prediction (no FlashVLA).
# Used as baseline to compare against FlashVLA FlashVLA.
#
# Hyperparameters aligned with RoboTwin official `pi05_aloha_full_base`,
# scaled for 8 GPU: eff_bs=16*8=128, steps=10000, lr sqrt(2)-scaled.
#
# Uses QUANTILE normalization with absolute qpos action (no delta).
# Data: /path/to/RoboTwin-LeRobot-v3.0/<task>/aloha-agilex_randomized_500/

policy:
  type: pi05
  pretrained_path: lerobot/pi05_base
  push_to_hub: false
  dtype: bfloat16
  device: cuda
  state_cond: false
  chunk_size: 50
  n_action_steps: 50
  freeze_vision_encoder: true
  normalization_mapping:
    VISUAL: IDENTITY
    STATE: QUANTILES
    ACTION: QUANTILES

dataset:
  repo_id: robotwin_official/per_task_placeholder
  video_backend: torchcodec

output_dir: pi05_baseline_robotwin_per_task/per_task_placeholder
job_name: pi05_baseline_per_task
batch_size: 16
grad_accum_steps: 1
steps: 10000
num_workers: 4
seed: 1000

use_policy_training_preset: false
optimizer:
  type: adamw
  lr: 3.5e-5
  betas: [0.9, 0.95]
  weight_decay: 1.0e-10
  grad_clip_norm: 1.0

scheduler:
  type: cosine_decay_with_warmup
  num_warmup_steps: 500
  peak_lr: 3.5e-5
  decay_lr: 2.5e-6
  num_decay_steps: 10000

save_checkpoint: true
save_freq: 2000

log_freq: 50
wandb:
  enable: true
  project: flashvla-robotwin
  entity: null
  disable_artifact: true

max_delay_steps: 0
