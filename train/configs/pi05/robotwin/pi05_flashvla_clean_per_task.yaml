# Policy configuration
policy:
  type: pi05-flashvla
  pretrained_path: lerobot/pi05_base
  push_to_hub: false
  dtype: bfloat16
  device: cuda
  state_cond: false
  num_buffer_slots: 4
  chunk_size: 20
  timestep_sample_mode: "per-chunk"
  freeze_vision_encoder: false
  freeze_vlm: false
  cold_start_mode: current_state
  normalization_mapping:
    VISUAL: IDENTITY
    STATE: QUANTILES
    ACTION: QUANTILES

# Dataset configuration
dataset:
  repo_id: robotwin_official_clean/per_task_placeholder
  video_backend: torchcodec
  
# Training parameters
output_dir: pi05_flashvla_clean_per_task/per_task_placeholder
job_name: pi05_flashvla_clean_per_task
batch_size: 16
grad_accum_steps: 1
steps: 10000
num_workers: 4
seed: 1000

# Optimizer configuration
use_policy_training_preset: false
optimizer:
  type: adamw
  lr: 5.0e-5
  betas: [0.9, 0.95]
  weight_decay: 1.0e-10
  grad_clip_norm: 1.0

# Learning rate scheduler
scheduler:
  type: cosine_decay_with_warmup
  num_warmup_steps: 500
  peak_lr: 5.0e-5
  decay_lr: 2.5e-6
  num_decay_steps: 10000

# Checkpointing
save_checkpoint: true
save_freq: 2000

# Logging
log_freq: 50
wandb:
  enable: true
  project: flashvla-robotwin
  entity: null
  disable_artifact: true
