policy:
  type: pi05-flashvla
  pretrained_path: lerobot/pi05_base
  push_to_hub: false
  dtype: bfloat16
  device: cuda
  state_cond: false
  num_buffer_slots: 4
  chunk_size: 20
  n_action_steps: 16
  freeze_vision_encoder: false
  cold_start_mode: current_state
  normalization_mapping:
    VISUAL: IDENTITY
    STATE: QUANTILES
    ACTION: QUANTILES

dataset:
  repo_id: lerobot/robotwin_unified
  video_backend: pyav

robotwin_multitask:
  enable: false

flashvla_init:
  mode: ae-norm-zero
  include_final_norm: true
  reset_time_mlp: true
  time_mlp_init: random
  action_expert_norm_init: zero

output_dir: outputs/train/pi05_flashvla_unified_clean_random_fsdp_bf16_100k
job_name: pi05-flashvla-unified-clean-random-fsdp-bf16-100k
batch_size: 8
grad_accum_steps: 4
steps: 100000
num_workers: 2
seed: 1000

fsdp:
  enable: true
  mixed_precision: bf16
  reduce_dtype: float32
  reshard_after_forward: false
  cpu_offload: false
  state_dict_type: SHARDED_STATE_DICT
  save_pretrained_max_shard_size: 50GB

use_policy_training_preset: false
optimizer:
  type: adamw
  lr: 5.0e-5
  betas: [0.9, 0.95]
  weight_decay: 1.0e-10
  grad_clip_norm: 1.0

scheduler:
  type: cosine_decay_with_warmup
  num_warmup_steps: 5000
  peak_lr: 5.0e-5
  decay_lr: 2.5e-7
  num_decay_steps: 100000

save_checkpoint: true
save_freq: 1000
checkpoint_keep_last: 5
checkpoint_keep_every_n_steps: 0

log_freq: 50
wandb:
  enable: true
  project: flashvla-robotwin-clean-random
  entity: null
  disable_artifact: true
