policy:
  type: pi05-flashvla
  pretrained_path: lerobot/pi05_base
  push_to_hub: false
  dtype: bfloat16
  device: cuda
  state_cond: false
  num_buffer_slots: 4
  chunk_size: 20
  freeze_vision_encoder: false
  cold_start_mode: current_state
  normalization_mapping:
    VISUAL: IDENTITY
    STATE: QUANTILES
    ACTION: QUANTILES

robotwin_multitask:
  enable: true
  root: /path/to/RoboTwin-LeRobot-v3.0
  config_subdirs:
    - aloha-agilex_clean_50            # clean-only; add aloha-agilex_randomized_500 to pool both
  tasks: []                            # empty = all tasks having every requested subdir
  stats_path: /path/to/RoboTwin-LeRobot-v3.0/_pooled_stats/clean_50tasks.json

# Required for output paths even when multitask is on (the multitask dataset is
# built from robotwin_multitask above, not from dataset.repo_id).
dataset:
  repo_id: robotwin/multitask_clean
  video_backend: torchcodec

output_dir: pi05_flashvla_robotwin
job_name: pi05_flashvla_robotwin
batch_size: 4
grad_accum_steps: 4
steps: 50000
num_workers: 4
seed: 1000

# FSDP2 with bf16 mixed precision, sharded across GPUs (default multi-GPU path)
fsdp:
  enable: true
  mixed_precision: bf16

use_policy_training_preset: false
optimizer:
  type: adamw
  lr: 3.0e-5
  betas: [0.9, 0.95]
  weight_decay: 1.0e-10
  grad_clip_norm: 1.0

scheduler:
  type: cosine_decay_with_warmup
  num_warmup_steps: 2000
  peak_lr: 3.0e-5
  decay_lr: 1.5e-6
  num_decay_steps: 50000

save_checkpoint: true
save_freq: 2000

log_freq: 50
wandb:
  enable: true
  project: flashvla-robotwin
  entity: null
  disable_artifact: true
