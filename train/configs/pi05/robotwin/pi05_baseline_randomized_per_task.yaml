# PI05 Baseline Per-Task Training on RoboTwin — RANDOMIZED setting
#
# Trains on aloha-agilex_randomized_500 (500 episodes per task with
# domain randomization: background textures, lighting, clutter, table
# height). ~10x more data than clean_50 but correspondingly fewer
# epochs at the same training budget.
#
# This is NOT the official leaderboard training recipe — the RoboTwin
# leaderboard trains on clean_50 only. This config is for stronger
# generalization via domain-randomized training.
#
# Data: /path/to/RoboTwin-LeRobot-v3.0/<task>/aloha-agilex_randomized_500/

policy:
  type: pi05
  pretrained_path: lerobot/pi05_base
  push_to_hub: false
  dtype: bfloat16
  device: cuda
  state_cond: false
  chunk_size: 50
  n_action_steps: 50
  freeze_vision_encoder: false
  normalization_mapping:
    VISUAL: IDENTITY
    STATE: QUANTILES
    ACTION: QUANTILES

dataset:
  repo_id: robotwin_official_randomized/per_task_placeholder
  video_backend: torchcodec

output_dir: pi05_baseline_randomized_per_task/per_task_placeholder
job_name: pi05_baseline_randomized
batch_size: 16
grad_accum_steps: 1
steps: 30000
num_workers: 4
seed: 1000

use_policy_training_preset: false
optimizer:
  type: adamw
  lr: 5.0e-5
  betas: [0.9, 0.95]
  weight_decay: 1.0e-10
  grad_clip_norm: 1.0

scheduler:
  type: cosine_decay_with_warmup
  num_warmup_steps: 1000
  peak_lr: 5.0e-5
  decay_lr: 2.5e-6
  num_decay_steps: 30000

save_checkpoint: true
save_freq: 2000

log_freq: 50
wandb:
  enable: true
  project: flashvla-robotwin-randomized
  entity: null
  disable_artifact: true

max_delay_steps: 0
