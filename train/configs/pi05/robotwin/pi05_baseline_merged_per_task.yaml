# PI05 Baseline Per-Task Training on RoboTwin — MERGED setting
#
# Trains on merged_550 (50 clean + 500 randomized episodes per task,
# re-indexed 0..549 and processed through the official openpi pipeline
# so stats are pooled over the union). Matches randomized-style data
# volume (~65k frames/task); use same training budget as randomized.
#
# NOT an official recipe — custom experiment combining clean + randomized
# for stronger generalization while still seeing clean trajectories.
#
# Data: /path/to/RoboTwin-LeRobot-v3.0-merged/<task>/merged_550/

policy:
  type: pi05
  pretrained_path: lerobot/pi05_base
  push_to_hub: false
  dtype: bfloat16
  device: cuda
  state_cond: false
  chunk_size: 50
  n_action_steps: 50
  freeze_vision_encoder: false
  normalization_mapping:
    VISUAL: IDENTITY
    STATE: QUANTILES
    ACTION: QUANTILES

dataset:
  repo_id: robotwin_official_merged/per_task_placeholder
  video_backend: torchcodec

output_dir: pi05_baseline_merged_per_task/per_task_placeholder
job_name: pi05_baseline_merged
batch_size: 16
grad_accum_steps: 1
steps: 50000
num_workers: 4
seed: 1000

use_policy_training_preset: false
optimizer:
  type: adamw
  lr: 3.5e-5
  betas: [0.9, 0.95]
  weight_decay: 1.0e-10
  grad_clip_norm: 1.0

scheduler:
  type: cosine_decay_with_warmup
  num_warmup_steps: 500
  peak_lr: 3.5e-5
  decay_lr: 2.5e-6
  num_decay_steps: 10000

save_checkpoint: true
save_freq: 2000

log_freq: 50
wandb:
  enable: true
  project: flashvla-robotwin-merged
  entity: null
  disable_artifact: true

max_delay_steps: 0
