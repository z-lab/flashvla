policy:
  type: lingbot
  pretrained_path: robbyant/lingbot-vla-4b
  # LingBot reads both the Qwen architecture and tokenizer from this repo.
  tokenizer_path: Qwen/Qwen2.5-VL-3B-Instruct
  push_to_hub: false
  dtype: bfloat16
  device: cuda

  chunk_size: 50
  n_action_steps: 16
  max_state_dim: 75
  max_action_dim: 75
  action_dim: 14
  num_steps: 10
  robotwin_feature_layout: true

  tokenizer_max_length: 72
  image_resolution: [224, 224]
  image_resize_mode: stretch
  attention_implementation: eager
  vision_attention_implementation: sdpa
  adanorm_time: true
  separate_time_proj: false
  old_adanorm: true
  loss_type: L1_fm
  use_cache: true
  freeze_vision_encoder: false
  gradient_checkpointing: false
  compile_model: false

  normalization_mapping:
    VISUAL: IDENTITY
    STATE: QUANTILES
    ACTION: QUANTILES

dataset:
  repo_id: lerobot/robotwin_unified
  root: /path/to/robotwin_unified
  video_backend: torchcodec

robotwin_multitask:
  enable: false

fsdp:
  enable: true
  mixed_precision: bf16
  reduce_dtype: float32
  reshard_after_forward: false

output_dir: lingbot_vla_baseline_robotwin
job_name: lingbot_vla_baseline_robotwin
batch_size: 8
grad_accum_steps: 4
steps: 100000
num_workers: 4
seed: 1000

use_policy_training_preset: false
optimizer:
  type: adamw
  lr: 5.0e-5
  betas: [0.9, 0.95]
  weight_decay: 0.0
  grad_clip_norm: 1.0
scheduler:
  type: cosine_decay_with_warmup
  num_warmup_steps: 5000
  peak_lr: 5.0e-5
  decay_lr: 2.5e-7
  num_decay_steps: 100000

save_checkpoint: true
save_freq: 1000
checkpoint_keep_last: 3

log_freq: 20
wandb:
  enable: true
  project: flashvla-robotwin
  entity: null
  disable_artifact: true
