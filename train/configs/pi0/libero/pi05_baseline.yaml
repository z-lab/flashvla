# FlashVLA Training Configuration for PI0
# Standard training without future-state-awareness

# Policy configuration
policy:
  type: pi0
  pretrained_path: lerobot/pi0_base
  push_to_hub: false
  dtype: bfloat16
  device: cuda

# Dataset configuration
dataset:
  repo_id: HuggingfaceVLA/libero
  video_backend: torchcodec

# Training parameters
output_dir: pi0_libero
job_name: pi0_libero
batch_size: 16
grad_accum_steps: 2
steps: 50000
num_workers: 4
seed: 1000

# Optimizer configuration
use_policy_training_preset: false
optimizer:
  type: adamw
  lr: 5.0e-5
  betas: [0.9, 0.95]
  weight_decay: 1.0e-10

# Learning rate scheduler
scheduler:
  type: cosine_decay_with_warmup
  num_warmup_steps: 1000
  peak_lr: 5.0e-5
  decay_lr: 2.5e-6
  num_decay_steps: 50000

# Checkpointing
save_checkpoint: true
save_freq: 2000

# Logging
log_freq: 200
wandb:
  enable: true
  project: flashvla-libero
  entity: null
  disable_artifact: true