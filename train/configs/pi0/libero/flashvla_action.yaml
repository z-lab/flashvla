# FlashVLA Training Configuration

# Policy configuration
policy:
  type: pi0-flashvla
  pretrained_path: lerobot/pi0_base
  push_to_hub: false
  dtype: bfloat16
  device: cuda
  # pi0 has no adaRMS / state_cond (state passed as a token); no separate
  # freeze_vision_encoder either — only freeze_vlm controls VLM-side freeze.
  num_buffer_slots: 5
  chunk_size: 10
  timestep_sample_mode: "per-chunk"
  freeze_vlm: false
  normalization_mapping:
    VISUAL: IDENTITY
    STATE: MEAN_STD
    ACTION: MEAN_STD


# Dataset configuration
dataset:
  repo_id: HuggingfaceVLA/libero
  video_backend: torchcodec

# Training parameters
output_dir: flashvla_action_libero_pi0/flashvla_action_libero_chunk10buffer5
job_name: flashvla_action_libero
batch_size: 16
grad_accum_steps: 2
steps: 50000
num_workers: 4
seed: 1000

# Optimizer configuration
use_policy_training_preset: false
optimizer:
  type: adamw
  lr: 1e-4
  betas: [0.9, 0.95]
  weight_decay: 1.0e-10

# Learning rate scheduler
scheduler:
  type: cosine_decay_with_warmup
  num_warmup_steps: 1000
  peak_lr: 1e-4
  decay_lr: 2.5e-6
  num_decay_steps: 50000

# Checkpointing
save_checkpoint: true
save_freq: 5000

# Logging
log_freq: 50
wandb:
  enable: true
  project: flashvla-libero
  entity: null
  disable_artifact: true
