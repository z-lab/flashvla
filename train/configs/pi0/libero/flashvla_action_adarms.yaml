# FlashVLA Training Configuration: pi0 FlashVLA + adaRMS
#
# Same as flashvla_action.yaml but with use_adarms_time_cond=true:
# - Keep baseline pi0's action_in_proj / action_time_mlp_in/out / state_proj
#   (still produce token embedding via the concat path; pi0_base weights
#   loaded as-is).
# - Add parallel FiLM cond paths: new time_mlp_in/out (random init) and
#   state_mlp_in/out (state_mlp_out zero-init).
# - Add patched GemmaRMSNorm.dense layers across the action expert
#   (zero weight + zero bias → step 0 is mathematically identical to
#   the concat-time baseline).
# - State suffix token is dropped; state enters only via adarms_cond.
#
# Use this yaml + flashvla_action.yaml for an A/B comparison: same hyper-
# parameters, same data, same step budget — only `use_adarms_time_cond`
# differs.

# Policy configuration
policy:
  type: pi0-flashvla
  pretrained_path: lerobot/pi0_base
  push_to_hub: false
  dtype: bfloat16
  device: cuda
  num_buffer_slots: 5
  chunk_size: 10
  timestep_sample_mode: "per-chunk"
  freeze_vlm: false
  use_adarms_time_cond: true          # ← FiLM ON (additive on top of baseline)
  normalization_mapping:
    VISUAL: IDENTITY
    STATE: MEAN_STD
    ACTION: MEAN_STD


# Dataset configuration
dataset:
  repo_id: HuggingfaceVLA/libero
  video_backend: torchcodec

# Training parameters
output_dir: flashvla_action_libero_pi0/flashvla_action_libero_chunk10buffer5_adarms
job_name: flashvla_action_libero_adarms
batch_size: 16
grad_accum_steps: 2
steps: 50000
num_workers: 4
seed: 1000

# Optimizer configuration
use_policy_training_preset: false
optimizer:
  type: adamw
  lr: 1e-4
  betas: [0.9, 0.95]
  weight_decay: 1.0e-10

# Learning rate scheduler
scheduler:
  type: cosine_decay_with_warmup
  num_warmup_steps: 1000
  peak_lr: 1e-4
  decay_lr: 2.5e-6
  num_decay_steps: 50000

# Checkpointing
save_checkpoint: true
save_freq: 5000

# Logging
log_freq: 50
wandb:
  enable: true
  project: flashvla-libero
  entity: null
  disable_artifact: true
